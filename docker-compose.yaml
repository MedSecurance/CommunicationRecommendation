version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medsec-db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsec-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      DefaultPlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL}
      DefaultPlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD}
      Email__Host: ${EMAIL_HOST}
      Email__HostPort: ${EMAIL_HOST_PORT}
      Email__SenderEmail: ${EMAIL_SENDER_EMAIL}
      Email__SenderPassword: ${EMAIL_SENDER_PASSWORD}
      Email__SenderName: ${EMAIL_SENDER_NAME}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BASE_URL: ${REACT_APP_API_BASE_URL}
    container_name: medsec-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
  
  monitor-matrix:
    network_mode: "host"
    build:
      context: ./monitor-matrix
      dockerfile: Dockerfile
      args:
        MEDSEC_URL: ${MEDSEC_URL}
        ADMIN_EMAIL: ${ADMIN_EMAIL}
        UPDATE_DELAY_MINUTES: ${UPDATE_DELAY_MINUTES}
        EMAIL_DELAY_DAYS: ${EMAIL_DELAY_DAYS}
    container_name: medsec-monitor-matrix
    volumes:
      - user-data:/app/user-data

  ids:
    build:
      context: ./ids
      dockerfile: Dockerfile
      args:
        MEDSEC_URL: ${MEDSEC_URL}
        ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "8501:8501"
    container_name: medsec-ids

volumes:
  pgdata:
  user-data:
