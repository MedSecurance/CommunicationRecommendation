services:
  postgres:
    image: postgres:16-alpine
    container_name: medsec-db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsec-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Email__Host: ${EMAIL_HOST}
      Email__HostPort: ${EMAIL_HOST_PORT}
      Email__SenderEmail: ${EMAIL_SENDER_EMAIL}
      Email__SenderPassword: ${EMAIL_SENDER_PASSWORD}
      Email__SenderName: ${EMAIL_SENDER_NAME}
      Keycloak__AuthorizationUrl: ${KEYCLOAK_BACKEND_URL}/realms/MedSec/protocol/openid-connect/auth
      Keycloak__MetadataAddress: ${KEYCLOAK_BACKEND_URL}/realms/MedSec/.well-known/openid-configuration
      Keycloak__Issuer: ${REACT_APP_KEYCLOAK_URL}/realms/MedSec
      Keycloak__TokenUrl: ${KEYCLOAK_BACKEND_URL}/auth/realms/MedSec/protocol/openid-connect/token
      EvidenceManagerApi__BaseUrl: ${EVIDENCE_MANAGER_API_URL}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BASE_URL: ${REACT_APP_API_BASE_URL}
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
    container_name: medsec-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  # Ideally monitor-matrix should be deployed within the network that you need to monitor 
  # using docker on Linux based OS. For testing purposes the tool can also be deployed 
  # locally under Windows and MAC OSes. See comments below for correct configuration.
  monitor-matrix:
    # Uncomment the following line for Linux deployment.
    # network_mode: "host" 
    build:
      context: ./monitor-matrix # replace with "./monitor-matrix-lite" to use the lite version
      dockerfile: Dockerfile
    container_name: medsec-monitor-matrix
    volumes:
      - user-data:/app/user-data
    environment:
      # The BACKEND_URL should be based on the backend container name if deployed locally, 
      # otherwise should be the IP address/URL of the backend server
      BACKEND_URL: "http://medsec-backend:8080" # Current URL is for local deployment only.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      UPDATE_DELAY_MINUTES: ${UPDATE_DELAY_MINUTES}
      EMAIL_DELAY_DAYS: ${EMAIL_DELAY_DAYS}
      KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_BACKEND_URL}
    # Comment the following two lines for Linux deployment when using "network_mode: host" above.
    ports:
      - "33761:33761" # replace with "33762:33762" to use the lite version

  ids:
    build:
      context: ./ids
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: "http://medsec-backend:8080" # Should be based on the backend container name 
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "8501:8501"
    container_name: medsec-ids

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: medsec-keycloak
    command: start-dev --import-realm --verbose
    
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/extensions/spi-event-listener-0.0.1-SNAPSHOT.jar:/opt/keycloak/providers/spi-event-listener-0.0.1-SNAPSHOT.jar
      - keycloak_identity_data:/opt/keycloak/data
    ports:
      - "8081:8080"

